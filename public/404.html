<!doctype html>

      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;

        background: rgba(255, 255, 255, .9);

        animation: settle .55s cubic-bezier(.2, .7, .2, 1) both;

      .brand { display: inline-flex; align-items: center; gap: 9px; color: #202b31; font-size: 15px; font-weight: 700; letter-spacing: -.04em; text-decoration: none; }

      .dot { width: 7px; height: 7px; border-radius: 50%; background: #56826c; box-shadow: 0 0 0 5px #e5efe8; }
      h1 { margin: 15px 0 12px; font-family: "Bricolage Grotesque", "Segoe UI", sans-serif; font-size: clamp(42px, 9vw, 68px); line-height: .99; letter-spacing: -.06em; }
      h1 span { color: #56826c; }
      p { max-width: 42ch; margin: 0 auto; color: #667276; font-size: 14px; line-height: 1.75; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 11px; margin-top: 28px; }
      .button { position: relative; display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 9px; overflow: hidden; padding: 0 18px; border: 1px solid #dce4e1; border-radius: 8px; color: #33413f; background: #fff; font: inherit; font-size: 13px; font-weight: 650; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
      .button-primary { border-color: #244f43; color: #fff; background: #244f43; box-shadow: 0 7px 17px rgba(36, 79, 67, .18); }

      .button-primary:hover { background: #326554; box-shadow: 0 12px 24px rgba(36, 79, 67, .23); }
      .button:focus-visible { outline: 3px solid #91b7a0; outline-offset: 3px; }
      .arrow { transition: transform .2s ease; }
      .button:hover .arrow { transform: translateX(4px); }
      .foot { margin-top: 54px; padding-top: 17px; border-top: 1px solid rgba(36, 58, 61, .12); color: #788387; font-size: 11px; }
      @keyframes settle { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; color: #e7ecea; background: #10191b; }
        body { background-image: linear-gradient(to bottom, rgba(210, 229, 220, .06) 1px, transparent 1px); }
        main { border-color: #2c3b3c; background: rgba(23, 34, 36, .94); box-shadow: 0 24px 70px rgba(0, 0, 0, .25); }
        .brand, h1 { color: #e7ecea; }
        .brand-mark { color: #c0d8c6; background: #2b4038; }
        .dot { box-shadow: 0 0 0 5px #283b32; }
        p { color: #a8b5b5; }
        .button { border-color: #394b4b; color: #dbe4e1; background: #202e30; }
        .button-primary { border-color: #b8d2be; color: #173329; background: #b8d2be; }
        .button-primary:hover { background: #cee1d0; }
        .foot { border-color: #2c3b3c; color: #9caaaa; }
      }

        main { padding: 30px 22px; }
        .code { margin-top: 44px; }
        .actions { display: grid; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
